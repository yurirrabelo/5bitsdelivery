# API Gateway: entrada única, autenticação (auth_request), rate limit e páginas web.
# Arquivo de conf.d (contexto http). Upstreams em variáveis: o Nginx sobe mesmo que um serviço não esteja no ar.

resolver 127.0.0.11 valid=10s;

map $http_upgrade $connection_upgrade { default upgrade; '' close; }
# Atrás do túnel a chave é o IP real do cliente
map $http_cf_connecting_ip $cliente_ip { "" $binary_remote_addr; default $http_cf_connecting_ip; }

limit_req_zone $cliente_ip zone=login:10m rate=10r/m;
limit_req_zone $cliente_ip zone=sessao:10m rate=10r/s;

server {
  listen 80;
  client_max_body_size 1m;
  absolute_redirect off;
  root /usr/share/nginx/html;

  # ---------------------------------------------------------- Autenticação
  location = /_auth {
    internal;
    set $up_auth http://auth:3000;
    proxy_pass $up_auth/auth/validate;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Original-URI $request_uri;
  }

  # ---------------------------------------------------------- Páginas
  location = / { return 302 /painel/; }

  location /painel/ { try_files $uri $uri/ /painel/index.html; }
  location /cliente/ { try_files $uri $uri/ /cliente/index.html; }
  location /entregador/ { try_files $uri $uri/ /entregador/index.html; }

  # O service worker e o manifest não podem ficar em cache
  location ~ ^/entregador/(sw\.js|manifest\.webmanifest)$ {
    add_header Cache-Control "no-cache";
  }

  # ---------------------------------------------------------- Auth
  location = /api/auth/login {
    limit_req zone=login burst=5 nodelay;
    set $up http://auth:3000;
    proxy_pass $up;
    proxy_set_header X-Request-Id $request_id;
  }

  location = /api/auth/cliente {
    limit_req zone=sessao burst=200;
    set $up http://auth:3000;
    proxy_pass $up;
    proxy_set_header X-Request-Id $request_id;
  }

  location /api/auth/ {
    include /etc/nginx/proxy-autenticado.conf;
    set $up http://auth:3000;
    proxy_pass $up;
  }

  # ---------------------------------------------------------- Serviços (JWT)
  location /api/pedidos/ {
    include /etc/nginx/proxy-autenticado.conf;
    set $up http://pedidos:8080;
    proxy_pass $up;
  }

  location = /api/pedidos {
    include /etc/nginx/proxy-autenticado.conf;
    set $up http://pedidos:8080;
    proxy_pass $up;
  }

  location /api/estoque {
    include /etc/nginx/proxy-autenticado.conf;
    set $up http://estoque:8080;
    proxy_pass $up;
  }

  location /api/entregas/ {
    include /etc/nginx/proxy-autenticado.conf;
    set $up http://entregas:3000;
    proxy_pass $up;
  }

  # WebSocket do mapa: o navegador não envia headers, o JWT vem em ?token=
  location /ws/entregas {
    include /etc/nginx/proxy-autenticado.conf;
    set $up http://entregas:3000;
    proxy_pass $up;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 1h;
  }

  # GPS do Traccar: sem JWT, o serviço valida o token do dispositivo
  location /gps {
    set $up http://entregas:3000;
    proxy_pass $up;
    proxy_set_header X-Request-Id $request_id;
  }

  # /auth/validate, /health e o gateway-pagamento nunca são expostos aqui
}
