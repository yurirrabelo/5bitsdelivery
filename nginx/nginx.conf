# API Gateway: entrada única, autenticação (auth_request), rate limit e páginas web.
# Arquivo de conf.d (contexto http). Upstreams em variáveis: o Nginx sobe mesmo que um serviço não esteja no ar.

resolver 127.0.0.11 valid=10s;

map $http_upgrade $connection_upgrade { default upgrade; '' close; }
# Atrás do túnel a chave é o IP real do cliente
map $http_cf_connecting_ip $cliente_ip { "" $binary_remote_addr; default $http_cf_connecting_ip; }

limit_req_zone $cliente_ip zone=login:10m rate=10r/m;
limit_req_zone $cliente_ip zone=sessao:10m rate=10r/s;
limit_req_status 429;

server {
  listen 80;
  client_max_body_size 1m;
  absolute_redirect off;
  root /usr/share/nginx/html;

  # As telas mudam junto com o código: o navegador confere se há versão nova a cada abertura (responde 304, é rápido).
  # Sem isto ele guarda a tela velha por horas e a versão nova não aparece no celular.
  add_header Cache-Control "no-cache" always;

  # ---------------------------------------------------------- Autenticação
  location = /_auth {
    internal;
    set $up_auth http://auth:3000;
    proxy_pass $up_auth/auth/validate;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Original-URI $request_uri;
  }

  # ---------------------------------------------------------- Páginas
  # A entrada (/) tem um login só: operador e entregador entram aqui e cada um vai para a sua tela
  location = / { try_files /index.html =404; }

  # JavaScript e estilos compartilhados pelas três telas (cada tela tem a sua sessão)
  location /comum/ { try_files $uri =404; }
  location /vendor/ { try_files $uri =404; }

  location /painel/ { try_files $uri $uri/ /painel/index.html; }
  location /cliente/ { try_files $uri $uri/ /cliente/index.html; }
  location /entregador/ { try_files $uri $uri/ /entregador/index.html; }
  # os testes de falha, só para ler (os botões só funcionam no servidor local do notebook, porta 8099)
  location /testes/ { try_files $uri $uri/ /testes/index.html; }

  # ---------------------------------------------------------- Auth
  location = /api/auth/login {
    limit_req zone=login burst=5 nodelay;
    set $up http://auth:3000;
    proxy_pass $up;
    proxy_set_header X-Request-Id $request_id;
  }

  location = /api/auth/cliente {
    limit_req zone=sessao burst=200;
    set $up http://auth:3000;
    proxy_pass $up;
    proxy_set_header X-Request-Id $request_id;
  }

  location /api/auth/ {
    include /etc/nginx/proxy-autenticado.conf;
    set $up http://auth:3000;
    proxy_pass $up;
  }

  # ---------------------------------------------------------- Serviços (JWT)
  location /api/pedidos/ {
    include /etc/nginx/proxy-autenticado.conf;
    set $up http://pedidos:8080;
    proxy_pass $up;
  }

  location = /api/pedidos {
    include /etc/nginx/proxy-autenticado.conf;
    set $up http://pedidos:8080;
    proxy_pass $up;
  }

  # CQRS (bônus): leitura da visão dos pedidos
  location /api/consultas/ {
    include /etc/nginx/proxy-autenticado.conf;
    set $up http://consultas:3000;
    proxy_pass $up;
  }

  location /api/estoque {
    include /etc/nginx/proxy-autenticado.conf;
    set $up http://estoque:8080;
    proxy_pass $up;
  }

  location /api/entregas/ {
    include /etc/nginx/proxy-autenticado.conf;
    set $up http://entregas:3000;
    proxy_pass $up;
  }

  # WebSocket do mapa: o navegador não envia headers, o JWT vem em ?token=
  location /ws/entregas {
    include /etc/nginx/proxy-autenticado.conf;
    set $up http://entregas:3000;
    proxy_pass $up;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 1h;
  }

  # /auth/validate, /health e o gateway-pagamento nunca são expostos aqui
}
