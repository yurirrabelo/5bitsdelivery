<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>5Bits Delivery · Entrar</title>
  <link rel="icon" type="image/svg+xml" href="/comum/logo.svg">
  <link rel="stylesheet" href="/comum/estilo.css">
  <style>
    body.tema-entrada {
      --fundo: #e9eef5; --cartao: #ffffff; --texto: #0f172a; --suave: #5b6b82; --borda: #d5deea;
      --acao: #2563eb; --acao-texto: #fff; --erro: #dc2626; --sombra: 0 4px 16px rgba(15, 23, 42, .08);
      min-height: 100dvh;
    }
    .tema-entrada .marca .bits { color: var(--marca); }
    .tema-entrada .dica { text-align: center; max-width: 340px; }
    /* as três interfaces do sistema */
    .interfaces { list-style: none; margin: 18px 0 0; padding: 0; display: grid; gap: 8px; width: 100%; max-width: 340px; }
    .interfaces a { display: grid; gap: 2px; padding: 10px 14px; border-radius: 12px; background: var(--cartao); border: 1px solid var(--borda);
                    color: var(--texto); text-decoration: none; box-shadow: var(--sombra); }
    .interfaces a:hover { border-color: var(--acao); }
    .interfaces b { font-size: 1rem; }
    .interfaces span { color: var(--suave); font-size: .85rem; }
  </style>
</head>
<body class="tema-entrada">
  <!-- Entrada única: a gestão e o entregador entram aqui e cada um vai para a sua tela. O cliente entra pelo QR code (Pedidos). -->
  <div id="login"></div>

  <script src="/comum/auth.js"></script>
  <script>
    (function () {
      const IR = { operador: '/painel/', entregador: '/entregador/' }; // o papel "operador" é a gestão
      // quem já entrou volta direto para a sua tela
      const sessao = Auth.sessaoDe('operador') || Auth.sessaoDe('entregador');
      if (sessao) return location.replace(IR[sessao.usuario.role]);

      Auth.montarLogin(document.getElementById('login'), ['operador', 'entregador'], (u) => location.replace(IR[u.role]), {
        icone: '🔐', titulo: 'Entrar', subtitulo: 'Gestão ou entregador: cada um vai para a sua tela.',
        botao: 'Entrar', rotuloUsuario: 'Usuário',
      });
      document.querySelector('.login-wrap').insertAdjacentHTML('beforeend',
        '<ul class="interfaces">' +
        '<li><a href="/painel/"><b>Gestão</b><span>as entregas ao vivo, com o GPS, e os pedidos manuais</span></a></li>' +
        '<li><a href="/entregador/"><b>Entregador</b><span>aceita os pedidos e leva até o cliente</span></a></li>' +
        '<li><a href="/cliente/"><b>Pedidos</b><span>o cliente pede o item, com ou sem o cupom (use o QR code do telão)</span></a></li>' +
        '</ul>');
    })();
  </script>
</body>
</html>
