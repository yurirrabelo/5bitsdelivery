name: delivery-tracker

# Fase 1: infraestrutura. Os serviços de aplicação entram nas fases seguintes.

x-postgres: &postgres
  image: postgres:16.16-alpine
  restart: unless-stopped
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
    interval: 5s
    timeout: 3s
    retries: 20

# Variáveis comuns a todo serviço de aplicação (credenciais vêm do Secrets Manager)
x-app-env: &app-env
  AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL}
  AWS_REGION: ${AWS_REGION}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
  SEGREDO_RABBITMQ: delivery/rabbitmq
  RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
  OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf

x-app-deps: &app-deps
  infra:
    condition: service_completed_successfully

services:
  # ------------------------------------------------------------ Entrada
  nginx:
    image: nginx:1.31-alpine
    restart: unless-stopped
    ports:
      - "${NGINX_PORTA}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/proxy-autenticado.conf:/etc/nginx/proxy-autenticado.conf:ro
      - ./web:/usr/share/nginx/html:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/painel/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ------------------------------------------------------------ Serviços de aplicação
  auth:
    build:
      context: .
      dockerfile: services/ts/Dockerfile
      args: { SERVICO: auth }
    restart: unless-stopped
    depends_on: *app-deps
    environment:
      <<: *app-env
      OTEL_SERVICE_NAME: auth
      SEGREDO_JWT: delivery/jwt
      JWT_EXPIRACAO_HORAS: ${JWT_EXPIRACAO_HORAS}
      EVENTO_CODIGO: ${EVENTO_CODIGO}
      OPERADOR_USUARIO: ${OPERADOR_USUARIO}
      OPERADOR_SENHA: ${OPERADOR_SENHA}
      ENTREGADOR1_USUARIO: ${ENTREGADOR1_USUARIO}
      ENTREGADOR1_SENHA: ${ENTREGADOR1_SENHA}
      ENTREGADOR1_NOME: ${ENTREGADOR1_NOME}
      ENTREGADOR2_USUARIO: ${ENTREGADOR2_USUARIO}
      ENTREGADOR2_SENHA: ${ENTREGADOR2_SENHA}
      ENTREGADOR2_NOME: ${ENTREGADOR2_NOME}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  pedidos:
    build:
      context: .
      dockerfile: services/java/Dockerfile
      args: { SERVICO: pedidos }
    restart: unless-stopped
    depends_on:
      <<: *app-deps
      pg-pedidos: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    mem_limit: 640m
    environment:
      <<: *app-env
      OTEL_SERVICE_NAME: pedidos
      # os campos do MDC (correlationId, messageId, type, pedidoId) viram atributos do log no Loki
      OTEL_INSTRUMENTATION_LOGBACK_APPENDER_EXPERIMENTAL_CAPTURE_MDC_ATTRIBUTES: "*"
      SEGREDO_DB: delivery/db/pedidos
      FILA_PEDIDOS: ${FILA_PEDIDOS}
      PRAZO_PAGAMENTO_SEG: ${PRAZO_PAGAMENTO_SEG}
      CLIENTE_PEDIDOS_EM_ANDAMENTO: ${CLIENTE_PEDIDOS_EM_ANDAMENTO}
      ORIGEM_NOME: ${ORIGEM_NOME}
      ORIGEM_LAT: ${ORIGEM_LAT}
      ORIGEM_LON: ${ORIGEM_LON}
      PROMOCAO_NOME: ${PROMOCAO_NOME}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 40s

  estoque:
    build:
      context: .
      dockerfile: services/java/Dockerfile
      args: { SERVICO: estoque }
    restart: unless-stopped
    depends_on:
      <<: *app-deps
      pg-estoque: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    mem_limit: 640m
    environment:
      <<: *app-env
      OTEL_SERVICE_NAME: estoque
      OTEL_INSTRUMENTATION_LOGBACK_APPENDER_EXPERIMENTAL_CAPTURE_MDC_ATTRIBUTES: "*"
      SEGREDO_DB: delivery/db/estoque
      FILA_ESTOQUE: ${FILA_ESTOQUE}
      PROMOCAO_NOME: ${PROMOCAO_NOME}
      PROMOCAO_QUANTIDADE: ${PROMOCAO_QUANTIDADE}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 40s

  gateway-pagamento:
    build:
      context: .
      dockerfile: services/ts/Dockerfile
      args: { SERVICO: gateway-pagamento }
    restart: unless-stopped
    environment:
      OTEL_SERVICE_NAME: gateway-pagamento
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      # com default para um script poder sobrescrever na hora, sem editar o .env:
      #   GATEWAY_TAXA_FALHA=100 docker compose up -d gateway-pagamento
      GATEWAY_LATENCIA_MS: ${GATEWAY_LATENCIA_MS:-0}
      GATEWAY_TAXA_FALHA: ${GATEWAY_TAXA_FALHA:-0}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Várias réplicas consumindo a mesma fila (sem container_name, para poder escalar)
  pagamento:
    build:
      context: .
      dockerfile: services/ts/Dockerfile
      args: { SERVICO: pagamento }
    restart: unless-stopped
    deploy:
      replicas: ${PAGAMENTO_REPLICAS}
    depends_on:
      <<: *app-deps
      pg-pagamento: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      gateway-pagamento: { condition: service_started }
    environment:
      <<: *app-env
      OTEL_SERVICE_NAME: pagamento
      SEGREDO_DB: delivery/db/pagamento
      FILA_PAGAMENTO: ${FILA_PAGAMENTO}
      GATEWAY_URL: http://gateway-pagamento:3000
      GATEWAY_TIMEOUT_MS: ${GATEWAY_TIMEOUT_MS}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  entregas:
    build:
      context: .
      dockerfile: services/ts/Dockerfile
      args: { SERVICO: entregas }
    restart: unless-stopped
    depends_on:
      <<: *app-deps
      pg-entregas: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    environment:
      <<: *app-env
      OTEL_SERVICE_NAME: entregas
      SEGREDO_DB: delivery/db/entregas
      SEGREDO_TELEGRAM: delivery/telegram
      REDIS_URL: redis://redis:6379
      FILA_ENTREGAS: ${FILA_ENTREGAS}
      GEOFENCE_RAIO_M: ${GEOFENCE_RAIO_M}
      NOTIFICACAO_PROVIDER: ${NOTIFICACAO_PROVIDER}
      NTFY_TOPICO: ${NTFY_TOPICO}
      S3_BUCKET_ROTAS: ${S3_BUCKET_ROTAS}
      ENTREGADOR1_NOME: ${ENTREGADOR1_NOME}
      ENTREGADOR1_DEVICE_ID: ${ENTREGADOR1_DEVICE_ID}
      ENTREGADOR1_TELEGRAM_CHAT_ID: ${ENTREGADOR1_TELEGRAM_CHAT_ID:-}
      ENTREGADOR2_NOME: ${ENTREGADOR2_NOME}
      ENTREGADOR2_DEVICE_ID: ${ENTREGADOR2_DEVICE_ID}
      ENTREGADOR2_TELEGRAM_CHAT_ID: ${ENTREGADOR2_TELEGRAM_CHAT_ID:-}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Entregador simulado: envia posições pelo mesmo caminho do Traccar (profile sim)
  #   docker compose --profile sim run --rm simulador smoke
  #   docker compose --profile sim run --rm simulador rota --arquivo /rotas/exemplo.geojson --device $ENTREGADOR2_DEVICE_ID
  simulador:
    profiles: ["sim"]
    build:
      context: .
      dockerfile: services/ts/Dockerfile
      args: { SERVICO: simulador }
    entrypoint: ["node", "simulador/dist/main.js"]
    depends_on:
      nginx: { condition: service_healthy }
    volumes:
      - ./simulador/rotas:/rotas:ro
    environment:
      GPS_URL: http://nginx/gps
      API_URL: http://nginx
      OPERADOR_USUARIO: ${OPERADOR_USUARIO}
      OPERADOR_SENHA: ${OPERADOR_SENHA}
      ENTREGADOR2_DEVICE_ID: ${ENTREGADOR2_DEVICE_ID}
      AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL}
      AWS_REGION: ${AWS_REGION}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      S3_BUCKET_ROTAS: ${S3_BUCKET_ROTAS}

  # ------------------------------------------------------------ Bônus (profile bonus)
  # CQRS: a fila consultas.entrada recebe todas as mensagens; a visão de cada pedido fica no DynamoDB.
  consultas:
    profiles: ["bonus"]
    build:
      context: .
      dockerfile: services/ts/Dockerfile
      args: { SERVICO: consultas }
    restart: unless-stopped
    depends_on: *app-deps
    environment:
      <<: *app-env
      OTEL_SERVICE_NAME: consultas
      FILA_CONSULTAS: ${FILA_CONSULTAS:-consultas.entrada}
      DYNAMODB_TABELA_VISAO: ${DYNAMODB_TABELA_VISAO:-delivery-visao-pedidos}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Autoescala do consumidor do pagamento. Monta o socket do Docker: só para a demonstração do bônus.
  autoscaler:
    profiles: ["bonus"]
    build:
      context: .
      dockerfile: services/ts/Dockerfile
      args: { SERVICO: autoscaler }
    restart: unless-stopped
    user: root
    depends_on:
      pagamento: { condition: service_healthy }
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      OTEL_SERVICE_NAME: autoscaler
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      RABBITMQ_API_URL: http://rabbitmq:15672
      RABBITMQ_USUARIO: ${RABBITMQ_USUARIO}
      RABBITMQ_SENHA: ${RABBITMQ_SENHA}
      FILA_PAGAMENTO: ${FILA_PAGAMENTO}
      AUTOSCALE_MIN: ${AUTOSCALE_MIN:-2}
      AUTOSCALE_MAX: ${AUTOSCALE_MAX:-6}
      AUTOSCALE_MENSAGENS_POR_REPLICA: ${AUTOSCALE_MENSAGENS_POR_REPLICA:-10}
      AUTOSCALE_INTERVALO_SEG: ${AUTOSCALE_INTERVALO_SEG:-5}
      AUTOSCALE_ESPERA_SEG: ${AUTOSCALE_ESPERA_SEG:-15}

  # ------------------------------------------------------------ Bancos
  pg-pedidos:
    <<: *postgres
    environment:
      POSTGRES_USER: pedidos
      POSTGRES_DB: pedidos
      POSTGRES_PASSWORD: ${DB_SENHA_PEDIDOS}
    volumes:
      - pg-pedidos-data:/var/lib/postgresql/data

  pg-estoque:
    <<: *postgres
    environment:
      POSTGRES_USER: estoque
      POSTGRES_DB: estoque
      POSTGRES_PASSWORD: ${DB_SENHA_ESTOQUE}
    volumes:
      - pg-estoque-data:/var/lib/postgresql/data

  pg-pagamento:
    <<: *postgres
    environment:
      POSTGRES_USER: pagamento
      POSTGRES_DB: pagamento
      POSTGRES_PASSWORD: ${DB_SENHA_PAGAMENTO}
    volumes:
      - pg-pagamento-data:/var/lib/postgresql/data

  pg-entregas:
    <<: *postgres
    environment:
      POSTGRES_USER: entregas
      POSTGRES_DB: entregas
      POSTGRES_PASSWORD: ${DB_SENHA_ENTREGAS}
    volumes:
      - pg-entregas-data:/var/lib/postgresql/data

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ------------------------------------------------------------ Mensageria
  rabbitmq:
    image: rabbitmq:4.4.0-management-alpine
    # hostname fixo + volume: sem isso as filas somem quando o container é recriado
    hostname: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USUARIO}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_SENHA}
    ports:
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./infra/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s

  # ------------------------------------------------------------ Nuvem (AWS emulada)
  ministack:
    image: ${MINISTACK_IMAGEM}
    restart: unless-stopped
    environment:
      PERSIST_STATE: "1"
      S3_PERSIST: "1"
      STATE_DIR: /data/state
      S3_DATA_DIR: /data/s3
    ports:
      - "127.0.0.1:4566:4566"
    volumes:
      - ministack-data:/data
    # o estado é gravado no desligamento
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:4566/_ministack/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  # Cria segredos, bucket, exchanges, filas e bindings (Terraform) e sai com 0
  infra:
    image: hashicorp/terraform:1.17.2
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    restart: "no"
    depends_on:
      ministack:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL}
      TF_PLUGIN_CACHE_DIR: /cache
      TF_IN_AUTOMATION: "1"
      TF_VAR_aws_endpoint_url: ${AWS_ENDPOINT_URL}
      TF_VAR_aws_region: ${AWS_REGION}
      TF_VAR_aws_access_key_id: ${AWS_ACCESS_KEY_ID}
      TF_VAR_aws_secret_access_key: ${AWS_SECRET_ACCESS_KEY}
      TF_VAR_s3_bucket_rotas: ${S3_BUCKET_ROTAS}
      TF_VAR_db_senha_pedidos: ${DB_SENHA_PEDIDOS}
      TF_VAR_db_senha_estoque: ${DB_SENHA_ESTOQUE}
      TF_VAR_db_senha_pagamento: ${DB_SENHA_PAGAMENTO}
      TF_VAR_db_senha_entregas: ${DB_SENHA_ENTREGAS}
      TF_VAR_rabbitmq_api_url: http://rabbitmq:15672
      TF_VAR_rabbitmq_usuario: ${RABBITMQ_USUARIO}
      TF_VAR_rabbitmq_senha: ${RABBITMQ_SENHA}
      TF_VAR_rabbitmq_exchange: ${RABBITMQ_EXCHANGE}
      TF_VAR_rabbitmq_dlx: ${RABBITMQ_DLX}
      TF_VAR_fila_pedidos: ${FILA_PEDIDOS}
      TF_VAR_fila_estoque: ${FILA_ESTOQUE}
      TF_VAR_fila_pagamento: ${FILA_PAGAMENTO}
      TF_VAR_fila_entregas: ${FILA_ENTREGAS}
      TF_VAR_max_tentativas: ${MAX_TENTATIVAS}
      TF_VAR_dynamodb_tabela_visao: ${DYNAMODB_TABELA_VISAO:-delivery-visao-pedidos}
      TF_VAR_fila_consultas: ${FILA_CONSULTAS:-consultas.entrada}
      INFRA_ACAO: ${INFRA_ACAO:-apply}
      TF_VAR_jwt_segredo: ${JWT_SEGREDO}
      TF_VAR_telegram_bot_token: ${TELEGRAM_BOT_TOKEN:-}
    volumes:
      - ./infra/terraform:/terraform:ro
      - ./infra/entrypoint.sh:/entrypoint.sh:ro
      - tf-state:/state
      - tf-cache:/cache

  # ------------------------------------------------------------ Observabilidade
  lgtm:
    image: grafana/otel-lgtm:0.41.0
    restart: unless-stopped
    environment:
      # acesso anônimo somente leitura (só em localhost)
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      # a tela "Apresentação" abre como página inicial
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /dashboards/apresentacao.json
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - lgtm-data:/data
      - ./observabilidade/prometheus.yaml:/otel-lgtm/prometheus.yaml:ro
      - ./observabilidade/dashboards:/dashboards:ro
      - ./observabilidade/provisionamento-dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/grafana-dashboards.yaml:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # ------------------------------------------------------------ Túnel HTTPS (opcional)
  cloudflared:
    image: cloudflare/cloudflared:2026.11.0
    profiles: ["tunnel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://nginx:80
    depends_on:
      - nginx

  # Testes de carga (profile carga): rodam dentro do Docker, direto no Nginx, sem passar pelo túnel
  #   docker compose --profile carga run --rm k6 run /carga/f5-corrida.js
  k6:
    image: grafana/k6:2.4.0
    profiles: ["carga"]
    entrypoint: ["k6"]
    depends_on:
      nginx: { condition: service_healthy }
    volumes:
      - ./carga:/carga:ro
    environment:
      BASE_URL: http://nginx
      EVENTO_CODIGO: ${EVENTO_CODIGO}
      K6_NO_USAGE_REPORT: "true"

volumes:
  pg-pedidos-data:
  pg-estoque-data:
  pg-pagamento-data:
  pg-entregas-data:
  rabbitmq-data:
  ministack-data:
  tf-state:
  tf-cache:
  lgtm-data:
